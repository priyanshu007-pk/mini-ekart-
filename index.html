<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Explorer - Undo Redo Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container header-content">
            <h1>🛒 Product Explorer</h1>

            <div class="header-actions">
                <button id="undo-btn" disabled>
                    ↩ Undo
                </button>

                <button id="redo-btn" disabled>
                    ↪ Redo
                </button>
            </div>
        </div>
    </header>


    <!-- Main Content -->
    <main class="container">

        <!-- Products Section -->
        <section class="products-section">

            <div class="section-heading">
                <h2>Products</h2>
                <p>Select products and add them to your cart.</p>
            </div>

            <!-- Products will be inserted by JavaScript -->
            <div id="product-list" class="product-grid"></div>

        </section>


        <!-- Cart Section -->
        <section class="cart-section">

            <div class="cart-header">
                <div>
                    <h2>Shopping Cart</h2>
                    <span id="item-count">0 items</span>
                </div>
            </div>


            <!-- Cart Items -->
            <div id="cart-items" class="cart-items">

                <!-- JavaScript will add cart items here -->

            </div>


            <!-- Empty Cart -->
            <div id="empty-cart" class="empty-cart">

                <div class="empty-icon">🛒</div>

                <h3>Your cart is empty</h3>

                <p>Add some products to get started.</p>

            </div>


            <!-- Cart Summary -->
            <div class="cart-summary">

                <div class="summary-row">
                    <span>Total Items</span>
                    <strong id="summary-items">0</strong>
                </div>

                <div class="summary-row total-row">
                    <span>Total</span>
                    <strong id="cart-total">₹0</strong>
                </div>

            </div>

        </section>


        <!-- Operation History -->
        <section class="history-section">

            <div class="section-heading">
                <h2>Operation History</h2>
                <p>Recent cart operations</p>
            </div>

            <div id="history-list" class="history-list">

                <p class="no-history">
                    No operations yet.
                </p>

            </div>

        </section>

    </main>


    <!-- Dataset -->
    <script src="data.js"></script>

    <!-- Challenge JavaScript -->
    <script src="app.js"></script>

</body>
</html>
